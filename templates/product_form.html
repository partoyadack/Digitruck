{% extends "base.html" %}{% block content %}<section class="section"><div class="heading"><h2>{{'ویرایش محصول' if p.id else 'افزودن محصول'}}</h2></div><form method="post" class="panel"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="formgrid"><label class="wide">نام محصول<input name="name" required value="{{p.name or ''}}"></label><label>دسته‌بندی<select name="category">{% for c in categories %}<option {% if p.category==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></label><label>برند<input name="brand" value="{{p.brand or ''}}"></label><label>قیمت تومان<input type="number" min="0" name="price" value="{{p.price or 0}}" required></label><label>قیمت قبلی<input type="number" min="0" name="old_price" value="{{p.old_price or ''}}"></label><label>موجودی<input type="number" min="0" name="stock" value="{{p.stock or 0}}" required></label><label>مدل‌های سازگار<input name="models" value="{{p.models or ''}}"></label><label class="wide">آدرس تصویر (URL)<input type="url" name="image" value="{{p.image or ''}}"></label><label class="wide">توضیحات<textarea name="description" rows="4">{{p.description or ''}}</textarea></label><label><input type="checkbox" name="featured" {% if p.featured %}checked{% endif %}> محصول ویژه</label><label><input type="checkbox" name="active" {% if p.id and p.active or not p.id %}checked{% endif %}> نمایش در فروشگاه</label></div><button class="btn red">ذخیره</button> <a class="btn ghost" href="{{url_for('admin_products')}}">انصراف</a></form></section>{% endblock %}
