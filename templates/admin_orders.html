{% extends "base.html" %}{% block content %}<section class="section"><div class="heading"><h2>مدیریت سفارش‌ها</h2><a href="{{url_for('admin')}}">پنل مدیریت</a></div><div class="tablewrap"><table><tr><th>شماره</th><th>مشتری و تلفن</th><th>مبلغ</th><th>تاریخ</th><th>تغییر وضعیت</th></tr>{% for o in orders %}<tr><td>{{o.number}}</td><td>{{o.customer}}<br>{{o.phone}}</td><td>{{money(o.total)}}</td><td>{{o.created_at|datefa}}</td><td><form method="post" action="{{url_for('set_status',oid=o.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><select name="status">{% for k,v in statuses.items() %}<option value="{{k}}" {% if o.status==k %}selected{% endif %}>{{v}}</option>{% endfor %}</select><button class="btn tiny">ثبت</button></form></td></tr>{% endfor %}</table></div></section>{% endblock %}
