<article class="card"><a class="photo" href="{{url_for('detail',slug=p.slug)}}">{% if p.image %}<img loading="lazy" src="{{p.image}}" alt="{{p.name}}">{% else %}<span>DT</span>{% endif %}{% if p.featured %}<b class="badge">ویژه</b>{% endif %}{% if p.stock<1 %}<b class="badge">ناموجود</b>{% endif %}</a><div class="cardbody"><small>{{p.category}} · {{p.brand}}</small><h3><a href="{{url_for('detail',slug=p.slug)}}">{{p.name}}</a></h3><p>سازگار با: {{p.models}}</p><strong>{{money(p.price)}} <small>تومان</small></strong>{% if p.stock>0 %}<form method="post" action="{{url_for('add',pid=p.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn red full">افزودن به سبد خرید ＋</button></form>{% else %}<button disabled class="btn full">ناموجود</button>{% endif %}</div></article>
