{% extends "base.html" %}{% block content %}<section class="section"><div class="heading"><h2>مدیریت محصولات</h2><a class="btn red" href="{{url_for('product_edit')}}">＋ افزودن محصول</a></div><div class="tablewrap"><table><tr><th>نام</th><th>دسته</th><th>قیمت</th><th>موجودی</th><th>وضعیت</th><th>عملیات</th></tr>{% for p in products %}<tr><td>{{p.name}}</td><td>{{p.category}}</td><td>{{money(p.price)}}</td><td>{{money(p.stock)}}</td><td>{{'فعال' if p.active else 'پنهان'}}</td><td><a href="{{url_for('product_edit',pid=p.id)}}">ویرایش</a> <form class="inline" method="post" action="{{url_for('hide_product',pid=p.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="remove">پنهان‌کردن</button></form></td></tr>{% endfor %}</table></div><p><a href="{{url_for('admin')}}">بازگشت به پنل</a></p></section>{% endblock %}
