{% extends "base.html" %}{% block content %}<section class="auth"><div class="mark">DT</div><h1>{{'ساخت حساب کاربری' if mode=='register' else 'ورود به حساب'}}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% if mode=='register' %}<label>نام و نام خانوادگی<input name="name" required minlength="2"></label>{% endif %}<label>ایمیل<input name="email" type="email" required></label><label>رمز عبور<input name="password" type="password" minlength="8" required></label><button class="btn red full">{{'ثبت‌نام' if mode=='register' else 'ورود'}}</button></form><p>{% if mode=='register' %}حساب داری؟ <a href="{{url_for('login')}}">ورود</a>{% else %}حساب نداری؟ <a href="{{url_for('register')}}">ثبت‌نام</a>{% endif %}</p></section>{% endblock %}
