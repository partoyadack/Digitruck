{% extends "base.html" %}{% block content %}<section class="section"><div class="heading"><h2>سفارش‌های من</h2></div>{% if orders %}<div class="tablewrap"><table><tr><th>شماره</th><th>تاریخ</th><th>مبلغ</th><th>وضعیت</th><th></th></tr>{% for o in orders %}<tr><td>{{o.number}}</td><td>{{o.created_at|datefa}}</td><td>{{money(o.total)}} تومان</td><td>{{statuses[o.status]}}</td><td><a href="{{url_for('order',number=o.number)}}">جزئیات</a></td></tr>{% endfor %}</table></div>{% else %}<div class="empty">هنوز سفارشی ثبت نکرده‌اید. <a href="{{url_for('home')}}">خرید کنید</a></div>{% endif %}</section>{% endblock %}
